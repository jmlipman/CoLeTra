batch_size: 2
batch_size_val: 1
callbacks:
- lib.callback._end_train_iteration_save_last_model_before_val
- lib.callback._start_training_scheduler_init
computer_name: titans
dataset:
  name: lib.data.Pulmonary
  params:
    id: gt
device: cuda
exp_name: AttentionUNet/CoLeTra/Pulmonary/dice
exp_run: 4
fold: 1
full_conf: true
iteration_start: 1
iterations: 7000
loss:
  name: lib.losses.MyDiceCELoss
  params:
    ignore_class: null
    lambda_ce: 0
    lambda_dice: 1
metrics_pred:
- name: lib.metrics.PartialDiceMetric
- name: lib.metrics.BettiErrorMetric
- name: lib.metrics.clDiceMetric
- name: lib.metrics.PartialHD95Metric
  params:
    voxres:
    - 0.25
    - 0.25
    - 0.5
- name: lib.metrics.SurfaceDistanceMetric
metrics_val:
- name: lib.metrics.PartialDiceMetric
model:
  name: monai.networks.nets.AttentionUnet
  params:
    channels:
    - 16
    - 24
    - 32
    in_channels: 1
    out_channels: 2
    spatial_dims: 3
    strides:
    - 1
    - 2
    - 2
move_config_file: true
optimizer:
  name: torch.optim.Adam
  params:
    lr: 0.001
    weight_decay: 1.0e-05
path_base: /scratch/jmvma/output/narwhals
path_exp: /scratch/jmvma/output/narwhals/AttentionUNet/CoLeTra/Pulmonary/dice/1
path_general_conf: config/general.yaml
path_specific_conf: config/exp1_train/4-pulmonary-att-coletra-dice-45-f1.yaml
path_split: /scratch/jmvma/data/PulmonaryVA/splits.yaml
random_seed: 45
scheduler:
  name: torch.optim.lr_scheduler.LambdaLR
  params:
    lr_lambda: 'lambda ep: (1 - ep/7000)**0.9'
transform_measure:
- name: monai.transforms.LoadImaged
  params:
    keys:
    - label
    - prediction
- name: monai.transforms.EnsureChannelFirstd
  params:
    keys:
    - label
    - prediction
- name: monai.transforms.AsDiscreted
  params:
    keys:
    - prediction
    to_onehot: 2
transform_post_pred:
- name: monai.transforms.Activations
  params:
    softmax: true
- name: monai.transforms.AsDiscrete
  params:
    argmax: true
    to_onehot: 2
transform_post_val:
- name: monai.transforms.Activations
  params:
    softmax: true
- name: monai.transforms.AsDiscrete
  params:
    argmax: true
    to_onehot: 2
transform_test:
- name: monai.transforms.LoadImaged
  params:
    keys:
    - image
- name: monai.transforms.EnsureChannelFirstd
  params:
    keys:
    - image
- name: monai.transforms.NormalizeIntensityd
  params:
    keys:
    - image
transform_train:
- name: monai.transforms.LoadImaged
  params:
    keys:
    - image
    - label
    - inpainted_v1
- name: monai.transforms.EnsureChannelFirstd
  params:
    keys:
    - image
    - label
    - inpainted_v1
- name: lib.transforms.MyNormalizeIntensityd
  params:
    keys:
    - image
    - inpainted_v1
    ref: image
- name: monai.transforms.RandZoomd
  params:
    keys:
    - image
    - label
    - inpainted_v1
    max_zoom: 1.75
    min_zoom: 1
    mode:
    - trilinear
    - nearest-exact
    - trilinear
    prob: 0.5
- name: monai.transforms.RandCropByLabelClassesd
  params:
    keys:
    - image
    - label
    - inpainted_v1
    label_key: label
    num_classes: 2
    num_samples: 15
    ratios:
    - 0
    - 1
    spatial_size:
    - 128
    - 128
    - 128
- name: lib.transforms.CoLeTraTransformd
  params:
    fill_type:
    - -2
    - -2
    holes: 6
    key_images:
    - image
    key_label: label
    key_label_class: 1
    prob: 1
    size:
    - 15
    - 15
    - 15
- name: monai.transforms.RandGaussianNoised
  params:
    keys:
    - image
    mean: 0
    prob: 0.5
    std: 1
- name: monai.transforms.RandAdjustContrastd
  params:
    gamma:
    - 0.8
    - 1.2
    keys:
    - image
    prob: 0.5
- name: monai.transforms.RandAxisFlipd
  params:
    keys:
    - image
    - label
    prob: 0.5
transform_val:
- name: monai.transforms.LoadImaged
  params:
    keys:
    - image
    - label
- name: monai.transforms.EnsureChannelFirstd
  params:
    keys:
    - image
    - label
- name: monai.transforms.NormalizeIntensityd
  params:
    keys:
    - image
val_inferer:
  name: monai.inferers.SlidingWindowInferer
  params:
    overlap: 0.25
    roi_size:
    - 128
    - 128
    - 128
    sw_batch_size: 1
val_interval: 700
